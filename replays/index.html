<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Replays Tensor</title>
<style>
:root{--bg:#f4f5f9;--card:#fff;--ink:#1b1f2a;--mute:#5d6577;--line:#dfe3ec;--acc:#5b3fd0;--chip:#eef0f6;--head:#1d2333}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141b;--card:#1b1e28;--ink:#e8eaf2;--mute:#9aa2b5;--line:#2c3140;--acc:#a28bff;--chip:#262a37;--head:#0d0f15}}
:root[data-theme="dark"]{--bg:#12141b;--card:#1b1e28;--ink:#e8eaf2;--mute:#9aa2b5;--line:#2c3140;--acc:#a28bff;--chip:#262a37;--head:#0d0f15}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--head);color:#fff;padding:14px 16px}
header .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
header b{font-size:18px;letter-spacing:.02em}
header a{color:#cfc6ff;text-decoration:none}header a:hover{text-decoration:underline}
main{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
h1{margin:0 0 4px;font-size:26px}
.sub{color:var(--mute);margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
article{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
video{width:100%;aspect-ratio:16/9;background:#000;display:block}
.body{padding:12px 14px 14px}
h2{margin:0 0 4px;font-size:17px}
.meta{color:var(--mute);font-size:13px;margin-bottom:8px}
.desc{margin:0 0 10px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips a,.chips span{background:var(--chip);border-radius:6px;padding:1px 7px;font-size:12.5px;color:var(--ink);text-decoration:none}
.chips a:hover{outline:1px solid var(--acc)}
.lbl{font-size:12px;color:var(--mute);margin:8px 0 3px;text-transform:uppercase;letter-spacing:.05em}
</style>
</head>
<body>
<header><div class="in"><b>Tensor</b><a href="../">← Pokédex</a><a href="../#/rankings">Classements</a><a href="../#/calc">Calculateur</a></div></header>
<main>
<h1>Replays</h1>
<p class="sub">Combats enregistrés sur le serveur Tensor. Cliquez sur un Pokémon pour ouvrir sa fiche dans le Pokédex.</p>
<div class="grid" id="grid"></div>
</main>
<script>
var R = [
	{ f: '2026-10-25-contrary-et-supreme-overlord', t: 'Contrary et Supreme Overlord', d: '25 oct. 2026', len: 312, turns: '40 tours',
	  desc: 'Hyperoffense : Superpower, Overheat et Psycho Boost qui boostent au lieu de baisser (Contrary), Magnitude 9 et Stone Edge de Lithosapher, Vargilien qui ouvre avec Mind Wrath.',
	  a: ['Vargilien', 'Lithosapher', 'Neutronomos', 'Nocturnus', 'Slythera', 'Asmodeus'], b: ['Clodsire', 'Dondozo', 'Slowbro', 'Lugia', 'Zamazenta', 'Ting-Lu'] },
	{ f: 'guerre-des-meteos-88-tours', t: 'Guerre des météos', d: 'oct. 2026', len: 706, turns: '88+ tours',
	  desc: 'Deluge contre Scorched Earth, retombées de Chernobyl, Revival Blessing et Double Osmium Bash : un combat d\'usure qui dépasse les 88 tours.',
	  a: ['Diluvorca', 'Calcinar', 'Kyogrouza', 'Urayne', 'Dredgear', 'Taravenger', 'Koramidon', 'Magiana', 'Burnexal', 'Lithosapher', 'Shifoo'], b: ['Arceus', 'Zygarde', 'Swampert', 'Tungsteeleal', 'Lugia', 'Corviknight'] },
	{ f: '2026-10-25-terre-brulee', t: 'Terre brûlée', d: '25 oct. 2026', len: 280, turns: '34 tours',
	  desc: 'Calcinar ouvre sous Scorched Earth : Precipice Blades, Super Ignition, puis Kyogrouza-Primal, Megzard, Pziktile et Haxornuk enchaînent.',
	  a: ['Calcinar', 'Kyogrouza-Primal', 'Megzard', 'Pziktile', 'Incandeat', 'Haxornuk'], b: ['Arceus', 'Zygarde', 'Dondozo', 'Tyranitar', 'Lugia', 'Bronzong'] },
	{ f: '2026-10-24-runes-et-permutate', t: 'Runes et Permutate', d: '24 oct. 2026', len: 465, turns: '58 tours',
	  desc: 'Elder Runes empilées, Stealth Rock et Spikes, puis Permutate à +5 en boucle : chaque entrée adverse coûte cher.',
	  a: ['Cornacol', 'Zenkei', 'Ferrumynx', 'Inuniferus', 'Tungsteeleal', 'Dustwing'], b: ['Arceus', 'Zygarde', 'Zamazenta', 'Tyranitar', 'Swampert', 'Goodra'] },
	{ f: '2026-10-13-tensor-contre-stall-manche-2', t: 'Tensor contre stall — manche 2', d: '13 oct. 2026', len: 344, turns: '44 tours',
	  desc: 'Revanche : Slythera, Taravenger (Glower, Septic Escape) et Mewfour (Moody) face à une défense officielle très lourde.',
	  a: ['Slythera', 'Taravenger', 'Magiana', 'Koramidon', 'Dredgear', 'Mewfour', 'Bugillion', 'Carchirin'], b: ['Toxapex', 'Corviknight', 'Chansey', 'Dondozo', 'Ting-Lu', 'Slowking'] },
	{ f: '2026-10-13-tensor-contre-stall-manche-1', t: 'Tensor contre stall — manche 1', d: '13 oct. 2026', len: 357, turns: '45 tours',
	  desc: 'Première rencontre entre une équipe Tensor de 16 et une équipe défensive officielle : Slythera, Aoseidon et Burnexal cherchent la brèche.',
	  a: ['Slythera', 'Aoseidon', 'Burnexal', 'Carchirin', 'Haxornuk', 'Urayne', 'Pixagma', 'Shifoo'], b: ['Giratina', 'Chansey', 'Toxapex', 'Dondozo', 'Zamazenta', 'Tungsteeleal'] },
];
function id(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, ''); }
function mmss(s) { s = Math.round(s); return Math.floor(s / 60) + ' min ' + String(s % 60).padStart(2, '0'); }
function chips(list) { return list.map(function (n) { return '<a href="../#/pokemon/' + id(n) + '">' + n + '</a>'; }).join(''); }
document.getElementById('grid').innerHTML = R.map(function (r) {
	return '<article><video controls preload="none" playsinline poster="' + r.f + '.jpg"><source src="' + r.f + '.mp4" type="video/mp4"></video>' +
		'<div class="body"><h2>' + r.t + '</h2><div class="meta">' + r.d + ' · ' + mmss(r.len) + ' · ' + r.turns + '</div><p class="desc">' + r.desc + '</p>' +
		'<div class="lbl">Équipe Tensor (Sar Ovii)</div><div class="chips">' + chips(r.a) + '</div>' +
		'<div class="lbl">En face (Yali Ou, extrait)</div><div class="chips">' + chips(r.b) + '</div></div></article>';
}).join('');
</script>
</body>
</html>
